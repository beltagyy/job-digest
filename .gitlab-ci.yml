stages:
  - lint
  - test
  - security

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install -r requirements.txt

# ── Lint ──────────────────────────────────────────────────────────────────────

flake8:
  stage: lint
  allow_failure: true
  script:
    - pip install flake8
    - flake8 . --max-line-length=120 --exclude=.venv,__pycache__ || true

black:
  stage: lint
  allow_failure: true
  script:
    - pip install black
    - black --check --line-length 120 . || true

# ── Tests ─────────────────────────────────────────────────────────────────────

pytest:
  stage: test
  allow_failure: false
  script:
    - pip install pytest pytest-mock pytest-cov
    - pytest tests/ -v
      --cov=matching
      --cov=storage
      --cov=email_digest
      --cov-report=term-missing
      --cov-report=xml
      --cov-fail-under=50
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# ── Security ──────────────────────────────────────────────────────────────────

semgrep:
  stage: security
  image: semgrep/semgrep
  allow_failure: true
  before_script: []
  script:
    - semgrep scan --config=auto . || true

bandit:
  stage: security
  allow_failure: true
  script:
    - pip install bandit
    - bandit -r . -x .venv,tests -ll || true

pip-audit:
  stage: security
  allow_failure: true
  script:
    - pip install pip-audit
    - pip-audit -r requirements.txt || true

detect-secrets:
  stage: security
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install detect-secrets
    - detect-secrets scan --exclude-files ".venv/.*" --exclude-files ".git/.*" > /tmp/secrets.json || true
    - python3 scripts/check_secrets.py || true

safety:
  stage: security
  allow_failure: true
  script:
    - pip install safety
    - safety check --full-report || true
